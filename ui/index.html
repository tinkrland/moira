<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>moira</title>
<link rel="stylesheet" href="/app/ui.css" />
</head>
<body>
<header class="bar">
  <span class="brand">moira</span>
  <span class="hint" id="status">owner session required</span>
  <form id="auth" class="auth">
    <input id="secret" type="password" placeholder="owner secret" autocomplete="off" />
    <button type="submit">open</button>
  </form>
</header>

<main id="deck" class="deck" aria-live="polite"></main>

<button id="new-persona" class="fab" title="new persona">+ persona</button>

<section id="inbox" class="detail inbox" hidden>
  <header class="detail-head">
    <h2>requests</h2>
    <button id="inbox-close" class="tiny">close</button>
  </header>
  <p class="meta">apps asking for context. nothing is readable until you decide.</p>
  <div id="inbox-body" class="detail-body"></div>
</section>

<button id="requests" class="fab fab-right" title="access requests">requests <span id="req-count">0</span></button>

<section id="detail" class="detail" hidden>
  <header class="detail-head">
    <h2 id="detail-name"></h2>
    <button id="detail-close" class="tiny">close</button>
  </header>
  <div id="detail-body" class="detail-body"></div>
</section>

<form id="create" class="panel create" hidden>
  <h2>new persona</h2>
  <label>name <input name="name" required placeholder="night desk" /></label>
  <label>identity
    <select name="identity">
      <option value="linked">linked</option>
      <option value="pseudonymous">pseudonymous</option>
    </select>
  </label>
  <label>email (optional) <input name="email" placeholder="desk@dearagent.shop" /></label>
  <button type="submit">create</button>
  <p id="create-msg" class="msg" role="status"></p>
</form>

<aside id="panel" class="panel" hidden>
  <h2 id="panel-title">share this hat</h2>
  <form id="pass-form">
    <label>agent <input name="clientId" placeholder="agent id" required /></label>
    <label>category <input name="category" value="preferences" required /></label>
    <label>purpose <input name="purpose" value="personalization" required /></label>
    <label>duration
      <select name="duration">
        <option value="session">session (1h)</option>
        <option value="one_time">one read</option>
        <option value="permanent">standing (90d, renew by hand)</option>
      </select>
    </label>
    <label>sets (comma separated; empty = full hat)
      <input name="sets" placeholder="work, side-projects" /></label>
    <label class="ack">
      <input type="checkbox" name="acknowledgeFull" />
      I understand an empty scope exposes the <b>whole hat</b>
    </label>
    <button type="submit">lend context</button>
    <p id="pass-msg" class="msg" role="status"></p>
  </form>
</aside>

<script src="/app/app.js"></script>
</body>
</html>
